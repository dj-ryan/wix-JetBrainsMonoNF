name: Release
on:
  workflow_dispatch:
jobs:
  package:
    uses: ./.github/workflows/reusable-package.yml
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - run: |
          tag="v${{ needs.package.outputs.version }}"
          gh release create "${tag}" --notes "JetBrainsMono Nerd Font ${tag}" ./build/*.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  winget:
    # Enable after the first manual winget-pkgs submission has been merged by
    # setting the repository variable WINGET_AUTOSUBMIT to 'true'.
    if: vars.WINGET_AUTOSUBMIT == 'true'
    needs: [package, release]
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        shell: pwsh
        run: |
          $version = '${{ needs.package.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/JetBrainsMono.msi"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update DjRyan.JetBrainsMonoNerdFont `
            --version $version `
            --urls $url `
            --submit `
            --token '${{ secrets.WINGET_TOKEN }}'
